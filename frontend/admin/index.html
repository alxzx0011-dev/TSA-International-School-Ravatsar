<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>School Login — TSA International School, Rawatsar, Rajasthan</title>
    <link rel="icon" href="../assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">

    <main class="login-card">
        <div class="login-brand">
            <img src="../assets/tsa-logo-256.jpg" alt="TSA International School logo" class="logo-icon logo-img">
            <span>
                <strong>TSA International</strong>
                <small>School, Rawatsar</small>
            </span>
        </div>

        <h1>School Login</h1>
        <p>Sign in to the admin panel, teacher portal, admissions portal or your student / parent account.</p>

        <form id="loginForm" novalidate>
            <label class="field">
                <span>Email</span>
                <input type="email" id="email" name="email" required
                       autocomplete="username">
            </label>

            <label class="field">
                <span>Password</span>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="Your password">
            </label>

            <p class="form-error" id="error" role="alert"></p>

            <button type="submit" class="btn primary" id="submitBtn">Sign In</button>
        </form>

        <a class="login-back" href="../index.html">← Back to website</a>
    </main>

    <script src="../config.js"></script>
    <script src="login.js"></script>
</body>
</html>
